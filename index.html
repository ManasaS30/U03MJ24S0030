
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0000000d;
        }

        h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            margin: 4px 2px;
        }

        .add-btn {
            background: #2563eb;
            margin-top: 15px;
        }

        .edit-btn {
            background: #d97706;
        }

        .delete-btn {
            background: #dc2626;
        }

        .cancel-btn {
            background: #64748b;
        }

        button:hover {
            opacity: 0.85;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 550px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #2563eb;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        #message {
            margin-top: 12px;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Student Management System</h1>

        <div class="card">
            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">
                <div class="form-grid">
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required
                    >

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required
                    >

                    <input
                        type="text"
                        id="course"
                        placeholder="Enter course"
                        required
                    >
                </div>

                <button type="submit" class="add-btn" id="submitBtn">
                    Add Student
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelBtn"
                    onclick="cancelEdit()"
                    hidden
                >
                    Cancel
                </button>

                <p id="message" role="status" aria-live="polite"></p>
            </form>
        </div>

        <div class="card">
            <h2>Student Details</h2>

            <button type="button" class="add-btn" onclick="getStudents()">
                Refresh Students
            </button>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                        <tr>
                            <td colspan="5">Loading students...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Flask API URL
        const API_URL = "http://127.0.0.1:5000/students";

        let editingId = null;

        const form = document.getElementById("studentForm");
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const courseInput = document.getElementById("course");
        const message = document.getElementById("message");
        const studentTable = document.getElementById("studentTable");

        // Display a message
        function showMessage(text, success = true) {
            message.textContent = text;
            message.style.color = success ? "green" : "red";
        }

        // GET: Display all students
        async function getStudents() {
            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Unable to fetch students");
                }

                const students = await response.json();

                studentTable.replaceChildren();

                if (students.length === 0) {
                    const row = studentTable.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 5;
                    cell.textContent = "No students found.";
                    return;
                }

                students.forEach(student => {
                    const row = studentTable.insertRow();

                    // Use textContent to display database values safely
                    [
                        student.id,
                        student.name,
                        student.email,
                        student.course
                    ].forEach(value => {
                        const cell = row.insertCell();
                        cell.textContent = value ?? "";
                    });

                    const actions = row.insertCell();

                    const editButton = document.createElement("button");
                    editButton.textContent = "Edit";
                    editButton.className = "edit-btn";
                    editButton.onclick = () => editStudent(student);

                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete";
                    deleteButton.className = "delete-btn";
                    deleteButton.onclick = () => deleteStudent(student.id);

                    actions.append(editButton, deleteButton);
                });

            } catch (error) {
                studentTable.replaceChildren();
                const row = studentTable.insertRow();
                const cell = row.insertCell();
                cell.colSpan = 5;
                cell.textContent = "Cannot connect to Flask. Check the server.";
                showMessage(error.message, false);
            }
        }

        // POST: Add student / PUT: Update student
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const student = {
                name: nameInput.value.trim(),
                email: emailInput.value.trim(),
                course: courseInput.value.trim()
            };

            if (!student.name || !student.email || !student.course) {
                showMessage("Please fill in all fields.", false);
                return;
            }

            const isEditing = editingId !== null;
            const url = isEditing
                ? `${API_URL}/${editingId}`
                : API_URL;

            const method = isEditing ? "PUT" : "POST";

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(student)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Operation failed");
                }

                showMessage(result.message || "Operation successful.");
                form.reset();
                cancelEdit();
                await getStudents();

            } catch (error) {
                showMessage(
                    "Error: " + error.message +
                    ". Ensure Flask is running.",
                    false
                );
            }
        });

        // Fill the form for editing
        function editStudent(student) {
            editingId = student.id;

            nameInput.value = student.name;
            emailInput.value = student.email;
            courseInput.value = student.course;

            document.getElementById("formTitle").textContent =
                "Update Student";

            document.getElementById("submitBtn").textContent =
                "Update Student";

            document.getElementById("cancelBtn").hidden = false;

            showMessage("Editing student ID: " + student.id);
            form.scrollIntoView({ behavior: "smooth" });
        }

        // Cancel editing
        function cancelEdit() {
            editingId = null;
            form.reset();

            document.getElementById("formTitle").textContent =
                "Add Student";

            document.getElementById("submitBtn").textContent =
                "Add Student";

            document.getElementById("cancelBtn").hidden = true;
        }

        // DELETE: Remove a student
        async function deleteStudent(id) {
            if (!confirm("Are you sure you want to delete this student?")) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: "DELETE"
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Delete failed");
                }

                showMessage(result.message || "Student deleted.");
                await getStudents();

            } catch (error) {
                showMessage("Error: " + error.message, false);
            }
        }

        // Load students when the page opens
        getStudents();
    </script>
</body>
</html>
